# Java API 基础配置。数据库默认值放在这里，server profile 可用环境变量覆盖。
server:
  # HTTP 服务端口。
  port: 8123

spring:
  application:
    # 应用名称，会出现在日志、Actuator 和服务注册信息中。
    name: enterprise-rag-java-api
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  datasource:
    # PostgreSQL JDBC 驱动。
    driver-class-name: org.postgresql.Driver
    # 默认本地数据库连接；服务器环境建议通过 RAG_DB_URL 覆盖。
    url: ${RAG_DB_URL:jdbc:postgresql://localhost:5432/enterprise_rag}
    # 默认数据库用户名；服务器环境建议通过 RAG_DB_USERNAME 覆盖。
    username: ${RAG_DB_USERNAME:rag}
    # 默认数据库密码；真实密码不要写入代码仓库。
    password: ${RAG_DB_PASSWORD:rag}
    hikari:
      pool-name: enterprise-rag-hikari-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      validation-timeout: 3000
      idle-timeout: 300000
      max-lifetime: 600000
      keepalive-time: 120000
  flyway:
    # 应用启动时自动执行未运行过的数据库迁移脚本。
    enabled: true
    # Flyway 从 classpath 下扫描 SQL 脚本。
    locations: classpath:db/migration
    #默认禁止自动给非空数据库建立基线；
    baseline-on-migrate: ${RAG_FLYWAY_BASELINE_ON_MIGRATE:false}
    validate-on-migrate: true
    clean-disabled: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 120MB

management:
  endpoints:
    web:
      exposure:
        # 暴露健康检查、基础信息和指标端点。
        include: health,info,metrics

rustfs:
    endpoint: ${RAG_STORAGE_ENDPOINT:http://localhost:9000}
    access-key-id: ${RAG_STORAGE_ACCESS_KEY_ID}
    secret-access-key: ${RAG_STORAGE_SECRET_ACCESS_KEY}
    bucket: ${RAG_STORAGE_BUCKET:rag-documents}
    region: ${RAG_STORAGE_REGION:us-east-1}
    path-style-access: true
rag:

  embedding:
    python-base-url: ${RAG_EMBEDDING_PYTHON_BASE_URL:http://localhost:9100}
    model: ${RAG_EMBEDDING_MODEL:text-embedding-v4}
    dimension: ${RAG_EMBEDDING_DIMENSION:1536}
    batch-size: ${RAG_EMBEDDING_BATCH_SIZE:10}
    timeout-seconds: ${RAG_EMBEDDING_TIMEOUT_SECONDS:60}
  security:
    jwt:
      #Token 签发方
      issuer: enterprise-rag-agent
      access-token-ttl: 15m
      private-key: file:${JWT_PRIVATE_KEY_PATH}
      public-key: file:${JWT_PUBLIC_KEY_PATH}
      refresh-token-ttl: 7d
    cors:
      allowed-origins: ${RAG_CORS_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      # MyBatis-Plus 逻辑删除字段。delete/deleteById 会更新该字段，而不是物理删除。
      logic-delete-field: deleted
      # PostgreSQL boolean 类型用 true 表示已删除，等价于业务语义里的 1。
      logic-delete-value: true
      # PostgreSQL boolean 类型用 false 表示未删除，等价于业务语义里的 0。
      logic-not-delete-value: false
logging:
  pattern:
    console: >-
      %d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}
      %-5level
      [%thread]
      %logger{36}
      requestId=%X{requestId:-}
      taskId=%X{taskId:-}
      tenantId=%X{tenantId:-}
      - %msg%n
